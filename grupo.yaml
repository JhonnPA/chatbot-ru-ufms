# =============================================================================
#  CONFIGURAÇÃO DO GRUPO - preencha todos os campos marcados com TODO.
#  Este arquivo é lido pelo código base, pelo notebook e pelo script de
#  avaliação. Mantenha a estrutura (nomes das chaves) exatamente como está.
#  Veja um exemplo completo em exemplos/biblioteca/grupo.yaml.
# =============================================================================

grupo:
  nome: "CGJ"
  integrantes:          # 3 a 4 integrantes
    - nome: "Jonathan Pereira do Amaral"
      rga: "202419060072"
    - nome: "Cleiton Pinheiro Rodrigues"
      rga: "202419060102"
    - nome: "Gabriel Mattos de Aquino"
      rga: "202419060064"
    - nome: "Felippe Baes Sales Lara"
      rga: "202219060141"

tema:
  nome: "Restaurante universitário"
  descricao: >
    Assistente virtual que tira dúvidas de estudantes da UFMS sobre o Restaurante
    Universitário: cardápio, horários, valores e isenções, recarga de créditos e formas de pagamento,
    cadastro de acesso e regras de uso.

dados:                  # caminhos relativos a este arquivo - não altere
  treino: dados/treino.csv
  teste: dados/teste.csv

modelos:                # caminhos relativos a este arquivo - não altere
  escopo: modelos/escopo.joblib
  tema: modelos/tema.joblib
  # carregador: "chatbot.meu_modulo:carregar"   # opcional; ver chatbot/modelos.py

# LLM que REDIGE as respostas do bot (via OpenRouter, com a chave do grupo).
# Os classificadores decidem a ROTA; o LLM só escreve o texto da resposta.
llm:
  modelo: "openai/gpt-6-luna"   # ou o modelo indicado pelo professor
  temperatura: 0.3                       # 0 = respostas mais estáveis; 1 = mais variadas
  max_tokens: 300
  usar_em: [intencoes, chitchat]         # nós em que o LLM redige a resposta
  persona: >
    Você é o Rango, assistente virtual do Restaurante Universitário (RU) da UFMS.
    Fale de forma simpática, direta e com linguagem simples, como um colega de
    campus. Responda apenas com base nos trechos de documentos fornecidos; se a
    informação não estiver neles, diga que não sabe e indique o contato. Nunca
    invente preços, horários, prazos ou regras.
  contato: "a Divisão de Alimentação da Proaes, pelo e-mail ru.proaes@ufms.br"
  max_frases: 3
  turnos_historico: 3

# Base de conhecimento (RAG). Coloque os documentos oficiais do tema em
# documentos/ (uma subpasta por intenção + geral/). O índice vetorial é criado
# automaticamente em .vectordb/ na primeira conversa com o LLM.
conhecimento:
  pasta: documentos
  representacao: tfidf        # tfidf (padrão) ou embeddings
  tamanho_trecho: 700
  k: 4
  similaridade_minima: 0.05

roteamento:
  # Abaixo desta confiança no tema, o bot pede esclarecimento em vez de responder.
  # 0 desliga o recurso. Escolha o valor com base em dados e justifique no relatório.
  limiar_tema: 0.0

# De 5 a 10 intenções. O nome (chave) deve ter só letras minúsculas sem acento,
# dígitos e "_". "descricao" aparece nas mensagens do bot ("Posso ajudar com: ...").
intencoes:
  cardapio:
    descricao: "cardápio do dia ou da semana"
    resposta: >
      O cardápio mensal é elaborado por nutricionistas e aprovado pela Proaes. O almoço
      e o jantar têm saladas, arroz e feijão, prato principal, guarnição e fruta, todos
      com opção vegetariana. O café da manhã tem bebidas quentes, pão, ovo mexido e fruta.
      Não há cardápio específico para alergias: consulte o nutricionista do RU.
  horarios:
    descricao: "horários de funcionamento"
    resposta: >
      Em Campo Grande, de segunda a sexta: café da manhã das 6h30 às 9h, almoço das
      10h30 às 14h e jantar das 17h30 às 20h30. Aos sábados, café e almoço nos mesmos
      horários. O RU fecha em feriados e pontos facultativos.
  valores:
    descricao: "preços das refeições e isenções"
    resposta: >
      Estudantes de graduação, mestrado, doutorado e residência com CadÚnico de até
      1,5 salário mínimo per capita pagam R$ 1,00 no café da manhã e R$ 3,00 no almoço
      e no jantar. Os demais estudantes, servidores e visitantes pagam o valor integral.
  recarga_creditos:
    descricao: "recarga de créditos e formas de pagamento"
    resposta: >
      A refeição é paga na hora, no cartão de débito, no cartão de crédito ou por Pix.
      Não há sistema de créditos nem recarga. Em caso de cobrança indevida, escreva
      para ru.proaes@ufms.br.
  cadastro:
    descricao: "cadastro e acesso ao RU"
    resposta: >
      Para usar o RU com subsídio, é preciso estar matriculado na UFMS, preencher o
      Perfil do Estudante no Siscad anexando o comprovante do CadÚnico, ter a Identidade
      Estudantil da UFMS e instalar o aplicativo Sou UFMS.
  regras_uso:
    descricao: "regras de uso do RU"
    resposta: >
      O RU atende estudantes de graduação, mestrado, doutorado e residência, servidores
      e visitantes da UFMS. Para outras dúvidas sobre regras de uso, consulte a Proaes
      pelo e-mail ru.proaes@ufms.br.

# Respostas dos nós que não são intenções. {assuntos} vira a lista de descrições
# das intenções; {opcao1}/{opcao2}, as duas intenções mais prováveis.
respostas:
  chitchat:
    saudacao: "Olá! Sou o Rango, assistente do RU da UFMS. Como posso ajudar?"
    agradecimento: "Por nada! Bom apetite!"
    despedida: "Até logo! Bom apetite!"
    padrao: "Sou o Rango, assistente automático do RU, e posso ajudar com: {assuntos}."
  fora_dominio: "Desculpe, só sei responder sobre o Restaurante Universitário. Posso ajudar com: {assuntos}."
  esclarecer: "Não tenho certeza se entendi. Sua dúvida é sobre {opcao1} ou sobre {opcao2}?"
